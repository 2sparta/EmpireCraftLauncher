name: Publish signed client channel
on:
  push:
    branches: [main]
    paths: ['mods/**', 'config/**', 'defaultconfigs/**', 'kubejs/**', 'launcher/native/dist/**']
  workflow_dispatch:
  schedule:
    - cron: '0 9 1 */3 *'
permissions:
  contents: write
concurrency:
  group: signed-channel
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main' && vars.LAUNCHER_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout: launcher
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install -r launcher/requirements.txt
      - name: Sign immutable pack files; refuse an absent or mismatched key
        env:
          LAUNCHER_SIGNING_KEY: ${{ secrets.LAUNCHER_SIGNING_KEY }}
        run: python launcher/tools/channel.py --url-repository 2sparta/EmpireCraftLauncher --output channel/stable.json
      - name: Publish signed channel
        run: |
          git config user.name 'Empirecraft release bot'
          git config user.email 'empirecraft-release@users.noreply.github.com'
          git add channel/stable.json
          git commit -m 'Publish signed client channel [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
